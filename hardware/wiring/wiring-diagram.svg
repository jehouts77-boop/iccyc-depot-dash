<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1200" height="760" fill="#faf8f4"/>
  <text x="24" y="36" font-size="22" font-weight="700" fill="#2a2118">ICCYC Depot Dashboard — wiring &amp; power, draft v0 (2026-09-30)</text>
  <text x="24" y="58" font-size="13" fill="#6b5a48">Power option A (recommended, pending VERIFY 1 &amp; 2). Pins = the M1 breadboard pins. Wire lengths come from the fitted case (M3).</text>

  <!-- legend -->
  <g font-size="12" fill="#2a2118" transform="translate(860,628)">
    <rect x="0" y="0" width="316" height="128" rx="8" fill="#fff" stroke="#d8cfc2"/>
    <line x1="14" y1="20" x2="54" y2="20" stroke="#c0392b" stroke-width="4"/><text x="62" y="24">5 V power</text>
    <line x1="14" y1="40" x2="54" y2="40" stroke="#222" stroke-width="3"/><text x="62" y="44">GND</text>
    <line x1="14" y1="60" x2="54" y2="60" stroke="#1f6fd1" stroke-width="3"/><text x="62" y="64">I2C SDA (blue) / SCL (yellow) — Qw/ST</text>
    <line x1="14" y1="80" x2="54" y2="80" stroke="#1e9e5a" stroke-width="3"/><text x="62" y="84">SPI to gauges + 3.3 V from 0x10</text>
    <line x1="14" y1="100" x2="54" y2="100" stroke="#8e44ad" stroke-width="3"/><text x="62" y="104">I2S to amp</text>
    <line x1="14" y1="118" x2="54" y2="118" stroke="#b07a1a" stroke-width="3"/><text x="62" y="122">switches / knob / LEDs (to GND bus)</text>
  </g>

  <!-- boxes -->
  <g font-size="14" fill="#2a2118">
    <rect x="30" y="300" width="170" height="90" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
    <text x="115" y="330" text-anchor="middle" font-weight="700">USB-C 5 V input</text>
    <text x="115" y="350" text-anchor="middle" font-size="12">5 V 3 A wall supply</text>
    <text x="115" y="368" text-anchor="middle" font-size="12">(only cable into the box)</text>

    <rect x="260" y="250" width="200" height="190" rx="10" fill="#fff6e0" stroke="#b07a1a" stroke-width="2"/>
    <text x="360" y="276" text-anchor="middle" font-weight="700">HUB (perfboard)</text>
    <text x="360" y="298" text-anchor="middle" font-size="12">5 V rail + GND rail</text>
    <text x="360" y="316" text-anchor="middle" font-size="12">Qw/ST split (1 in, 2 out)</text>
    <text x="360" y="334" text-anchor="middle" font-size="12">GND bus start</text>
    <text x="360" y="352" text-anchor="middle" font-size="12">optional sockets for</text>
    <text x="360" y="368" text-anchor="middle" font-size="12">0x10 / 0x11 (USB flashing)</text>

    <rect x="250" y="90" width="230" height="110" rx="10" fill="#eef3fb" stroke="#1f6fd1" stroke-width="2"/>
    <text x="365" y="118" text-anchor="middle" font-weight="700">PRESTO</text>
    <text x="365" y="140" text-anchor="middle" font-size="12">battery JST-PH ← 5 V (3–5.5 V)</text>
    <text x="365" y="158" text-anchor="middle" font-size="12">Qw/ST → I2C (red 3.3 V: not used)</text>
    <text x="365" y="176" text-anchor="middle" font-size="12">own USB-C free for programming</text>

    <rect x="560" y="120" width="200" height="150" rx="10" fill="#eaf7ef" stroke="#1e9e5a" stroke-width="2"/>
    <text x="660" y="146" text-anchor="middle" font-weight="700">0x10 GAUGES</text>
    <text x="660" y="166" text-anchor="middle" font-size="12">RP2040-Zero, 5V pin ← rail</text>
    <text x="660" y="184" text-anchor="middle" font-size="12">GP0 SDA  GP1 SCL</text>
    <text x="660" y="202" text-anchor="middle" font-size="12">GP2 SCK  GP3 MOSI (shared)</text>
    <text x="660" y="220" text-anchor="middle" font-size="12">I: GP4 CS  GP5 DC  GP6 RST</text>
    <text x="660" y="238" text-anchor="middle" font-size="12">II: GP7 CS  GP8 DC  GP9 RST</text>
    <text x="660" y="256" text-anchor="middle" font-size="12">3V3 → both gauge VCC</text>

    <rect x="850" y="250" width="150" height="70" rx="35" fill="#fff" stroke="#1e9e5a" stroke-width="2"/>
    <text x="925" y="280" text-anchor="middle" font-weight="700">GAUGE I</text>
    <text x="925" y="298" text-anchor="middle" font-size="11">VCC GND SCL SDA</text><text x="925" y="311" text-anchor="middle" font-size="11">DC CS RST</text>
    <rect x="1020" y="250" width="150" height="70" rx="35" fill="#fff" stroke="#1e9e5a" stroke-width="2"/>
    <text x="1095" y="280" text-anchor="middle" font-weight="700">GAUGE II</text>
    <text x="1095" y="298" text-anchor="middle" font-size="11">VCC GND SCL SDA</text><text x="1095" y="311" text-anchor="middle" font-size="11">DC CS RST</text>

    <rect x="560" y="420" width="200" height="190" rx="10" fill="#f6eefa" stroke="#8e44ad" stroke-width="2"/>
    <text x="660" y="446" text-anchor="middle" font-weight="700">0x11 CONTROLS</text>
    <text x="660" y="466" text-anchor="middle" font-size="12">RP2040-Zero, 5V pin ← rail</text>
    <text x="660" y="484" text-anchor="middle" font-size="12">GP0 SDA  GP1 SCL</text>
    <text x="660" y="502" text-anchor="middle" font-size="12">GP2 A  GP3 B  GP4 push</text>
    <text x="660" y="520" text-anchor="middle" font-size="12">GP5 CHIME  GP6 DAY·NIGHT</text>
    <text x="660" y="538" text-anchor="middle" font-size="12">GP7 BACKLIGHT  GP8 WIFE</text>
    <text x="660" y="556" text-anchor="middle" font-size="12">GP9 WiFi LED  GP10 OTA LED</text>
    <text x="660" y="574" text-anchor="middle" font-size="12">GP11 BCLK  GP12 LRC  GP13 DIN</text>

    <rect x="850" y="380" width="320" height="120" rx="10" fill="#fff" stroke="#b07a1a" stroke-width="2"/>
    <text x="1010" y="406" text-anchor="middle" font-weight="700">FRONT PANEL</text>
    <text x="1010" y="426" text-anchor="middle" font-size="12">EC11 knob: A–C–B (C → GND), push → GND</text>
    <text x="1010" y="444" text-anchor="middle" font-size="12">4 toggles: one leg → GPIO, other → GND bus</text>
    <text x="1010" y="462" text-anchor="middle" font-size="12">2 pilot LEDs: GPIO → 330 Ω → LED → GND</text>
    <text x="1010" y="484" text-anchor="middle" font-size="12" fill="#6b5a48">one GND bus wire along the row</text>

    <rect x="850" y="540" width="150" height="80" rx="10" fill="#f6eefa" stroke="#8e44ad" stroke-width="2"/>
    <text x="925" y="568" text-anchor="middle" font-weight="700">MAX98357A</text>
    <text x="925" y="588" text-anchor="middle" font-size="12">Vin ← 5 V rail</text>
    <text x="925" y="606" text-anchor="middle" font-size="12">(not via 0x11)</text>
    <rect x="1030" y="540" width="140" height="80" rx="10" fill="#fff" stroke="#8e44ad" stroke-width="2"/>
    <text x="1100" y="572" text-anchor="middle" font-weight="700">SPEAKER</text>
    <text x="1100" y="592" text-anchor="middle" font-size="12">70×31 mm, 4 Ω</text>
    <text x="1100" y="608" text-anchor="middle" font-size="11">twisted pair</text>
  </g>

  <!-- power -->
  <g stroke="#c0392b" stroke-width="4" fill="none">
    <path d="M200 330 H260"/>
    <path d="M300 250 V200"/>
    <path d="M460 280 H520 V180 H560"/>
    <path d="M460 400 H520 V470 H560"/>
    <path d="M460 420 H500 V650 H820 V600 H850"/>
  </g>
  <g stroke="#222" stroke-width="2.5" fill="none">
    <path d="M200 360 H260"/>
  </g>
  <!-- I2C -->
  <g stroke="#1f6fd1" stroke-width="3" fill="none">
    <path d="M420 200 V250"/>
    <path d="M460 300 H540 V210 H560"/>
    <path d="M460 380 H540 V500 H560"/>
  </g>
  <!-- SPI + 3V3 -->
  <g stroke="#1e9e5a" stroke-width="3" fill="none">
    <path d="M760 200 H925 V250"/>
    <path d="M760 200 H1095 V250"/>
  </g>
  <!-- controls -->
  <g stroke="#b07a1a" stroke-width="3" fill="none">
    <path d="M760 520 H810 V440 H850"/>
  </g>
  <!-- I2S + speaker -->
  <g stroke="#8e44ad" stroke-width="3" fill="none">
    <path d="M760 580 H850"/>
    <path d="M1000 580 H1030"/>
  </g>

  <g font-size="12" fill="#6b5a48">
    <text x="215" y="320">5 V</text>
    <text x="306" y="232">5 V → JST-PH</text>
    <text x="426" y="232">Qw/ST</text>
    <text x="770" y="192">SPI + 3.3 V (short, &lt; 15 cm)</text>
    <text x="510" y="644">5 V straight to the amp</text>
  </g>

  <g font-size="12" fill="#2a2118" transform="translate(24,676)">
    <text y="0" font-weight="700">VERIFY before soldering:</text>
    <text y="18">1. Presto schematic: battery input and USB diode-combined (safe to plug a laptop in with the 5 V rail on).</text>
    <text y="36">2. RP2040-Zero: is the 5V pin tied straight to USB 5 V? If so: unplug case power before plugging a Zero into the computer.</text>
    <text y="54">3. Kit JST-SH cable fits the Presto's Qw/ST port.</text>
    <text y="72">4. Real current with a USB power meter (expect ~0.5 A typical, ~1.4 A peak).</text>
  </g>
</svg>
